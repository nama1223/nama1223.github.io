    #lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; box-sizing: border-box; }

    .lightbox-controls { display: flex; justify-content: space-between; width: 100%; position: absolute; top: 50%; transform: translateY(-50%); padding: 0 20px; box-sizing: border-box; pointer-events: none; z-index: 1001;}

<script>
const APP_CONFIG = {"appUrl": "/NamaKe/", "appIcon": "/NamaKe/Namake512.png", "media": [{"type": "image", "src": "screen-top.jpg"}, {"type": "image", "src": "screen-calc.jpg"}, {"type": "image", "src": "screen-days.jpg"}, {"type": "image", "src": "screen-budget.jpg"}, {"type": "image", "src": "screen-year.jpg"}, {"type": "image", "src": "screen-counter.jpg"}, {"type": "image", "src": "screen-timediff.jpg"}, {"type": "image", "src": "screen-warikan.jpg"}, {"type": "image", "src": "screen-line.jpg"}, {"type": "image", "src": "screen-namasu-list.jpg"}, {"type": "image", "src": "screen-namasu-run.jpg"}, {"type": "image", "src": "screen-reverse-todo.jpg"}, {"type": "image", "src": "screen-yaraseru.jpg"}], "moreApps": [{"id": "namacollage", "icon": "/NamaCollage/NamaCollageLogo512.png", "url": "/NamaCollage/"}, {"id": "namatunepdf", "icon": "/NamaTunePDF/NamaTunePDF512.png", "url": "/NamaTunePDF/"}, {"id": "namapo", "icon": "/NamaPo/NamaPo512.png", "url": "/NamaPo/"}], "ja": {"title": "NamaKe ─ 計算ツール集「なまけ」─", "developer": "生", "buttonText": "Webアプリを起動", "screenshotsTitle": "スクリーンショット/画面説明", "description": "日々の「ちょっと計算したい」を集めた計算ツール集、その名も「なまけ」。「プライベート用途」と銘打っているのは、汎用化する気のない自分向け仕様が多めだからで、公開自体はしています。\n\n■ ツール全11種\n単なる電卓／数をかぞえるやつ\n日数計算機／時間差計算／「年」計算機\n予算収支計算機／ワリカン／LINE用外部ブラウザURL\nNamaStopwatch（なます）／逆算ToDo／やらせるToDo\n一覧の並べ替えもできます。各ツールの説明は以下の通りです。\n\n■ 単なる電卓\n四則演算ができる、シンプルな電卓です。大きめのキーで入力し、計算式と結果が表示されます。下部にメモ欄が3つあります。\n\n■ 数をかぞえるやつ\n交通量調査で使われるカウンターをマネしたカウンターです。1〜10の枠を切り替えて、それぞれ別々に数えられます。大きなTAPエリアをタップしてカウントし、数値は7セグメント風の表示で大きく出ます。効果音のON/OFF切り替えと、現在の枠のリセットができます。\n\n■ 日数計算機\n基準日から見て何日前、または何日後の日付を計算し、カレンダーにも表示します。\n\n■ 時間差計算\n開始時間と終了時間を設定すると、経過時間が計算されます。結果は「○時間○○分」の形で表示され、合計分数も併記されます。\n\n■ 「年」計算機\n西暦⇔和暦の変換機です。西暦→和暦は全種類（令和・平成・昭和・大正・明治）に対応し、和暦→西暦もできます。誕生日⇔年齢の変換もあり、誕生日から現在の年齢、現在の年齢から誕生日の範囲が分かります。\n\n■ 予算収支計算機\n最初に予算を設定し、出費を一件ずつ追加していくと、収支が自動計算されます。出費合計の表示と、出費の全クリアができます。\n\n■ ワリカン\n合計金額と人数を入れて割り勘を計算します（税率の指定もできます）。端数は「キリを良くする」で調整でき（一円単位／余らせる／足りなくする、単位は10円・100円・500円・1000円）、班ごとに価格差をつけることもできます。\n\n■ LINE用外部ブラウザURL\nLINEのトークにURLを貼るとLINEの内部ブラウザで開かれてしまいますが、URLの終わりに ?openExternalBrowser=1 をつけると外部ブラウザへ誘導できます。このツールでは、クリップボードのURLや手動入力したURLにそのパラメータを付けてコピーできます。\n\n■ NamaStopwatch（なます）\n名前をつけたストップウォッチを事前に複数用意しておけるストップウォッチです。曲ごとに「曲リスト」で管理し、1曲につき計測を複数回追加できます（計測には日時が残ります）。曲の並べ替えや、計測結果の集計もできます。計測中は曲名と時間が大きく表示され、画面のどこでもタップで停止できます。「画面をスリープさせない」設定もあります。合奏中に曲ごとの時間を計測でき、演奏会のスケジューリングに使います。\n\n■ 逆算ToDo\n出かける時刻から逆算して、支度や移動の段取りを並べるToDoです。やることと所要時間を入れておくと完了予定時刻が出て、スケジュールが通知エリアに常時表示されます。行動セット／フルセットで、いつもの支度の流れを丸ごと呼び出すこともできます。遅刻を減らすための工夫として作った機能です。\nなお、予定時刻に通知・バイブで知らせる機能は、APK版（Android用アプリ版）の機能です。PWAでは端末のスリープに弱く、確実に鳴らしたい用途には向きません（スリープしない前提でPCで運用する場合は、PWAでも使えます）。\n\n■ やらせるToDo\nカメラによる生存確認と組み合わせたToDoです。「開始」から「完了」までの間、数分おきに確認が入り、カメラを手で塞いで「起きています」と報告します。確認の間隔は固定／ランダム（最短・最長）で設定でき、応答時間内に報告できないと強いアラームと全画面表示で知らせます。カメラは確認の数秒前から確認中だけ使い、映像は保存も送信もしません。カメラが使えない時は、設定内の原因調査で動いているURLや許可の状態などを確認できます。\nなお、強いアラームや全画面表示のような「確実に起こす」ための機能は、APK版（Android用アプリ版）の機能です。PWAでは端末のスリープに弱いためです（スリープしない前提でPCで運用する場合は、PWAでも使えます）。\n\n■ 共通機能\n通知音の設定（音の種別はアラーム音／通知音から選択、音色も選べます）、設定の読み込み・出力（データを.nmkファイルに書き出してバックアップや端末の引っ越しができ、読み込み時は項目を選んで上書きできます）、メニューの並び順を初期配置に戻す、更新チェック、アプリとしてインストールなどがあります。日付や時刻の入力は、タップで直接入力と上下ドラッグのダイヤル調整の両方に対応しています。\n\n■ 画面説明（スクリーンショットの見方）\n1) 一覧: 使いたいツールをタップ。左端のハンドルのドラッグで並べ替え。\n2) 単なる電卓: 大きめキーと、メモ欄3つつき。\n3) 日数計算機: 基準日＋日数で、和暦つきの日付をカレンダー表示。\n4) 予算収支計算機: 出費を追加していくと収支が自動計算。\n5) 「年」計算機: 西暦⇔和暦と、年齢まわりの変換。\n6) 数をかぞえるやつ: 枠1〜10を切り替えて、大きなTAPエリアをタップしてカウント。\n7) 時間差計算: 開始と終了の時刻から経過時間を計算。合計分数も表示。\n8) ワリカン: 合計金額と人数を入れ、端数のキリの良さや班ごとの価格差を調整。\n9) LINE用外部ブラウザURL: クリップボードや手動入力のURLにパラメータを付けてコピー。\n10) なます（曲リスト）: 曲ごとに計測を追加でき、並べ替えと集計もできる。\n11) なます（計測中）: 曲名と時間が大きく表示。画面のどこでもタップで停止。\n12) 逆算ToDo: やることと所要時間を入れると、完了予定時刻ごとのスケジュールが表示される。\n13) やらせるToDo（設定・生存確認）: カメラを手で塞いで起きていることを報告。確認の間隔や応答時間を設定。", "moreAppsTitle": "生 の他のアプリ", "moreAppNames": {"namacollage": "なまこ", "namatunepdf": "NamaTunePDF", "namapo": "NamaPo"}, "apkButtonText": "🤖 APK版（Android）をダウンロード"}, "en": {"title": "NamaKe - A Pocket Calculator Toolkit 'Namake' -", "developer": "Nama", "buttonText": "Launch Web App", "screenshotsTitle": "Screenshots & Guide", "description": "A collection of small calculators for everyday 'just need to compute this' moments. It calls itself 'for private use' because many tools are tailored to the author's own needs rather than generalized - but it is public.\n\n■ 11 tools\n[Simple calculating & counting] Plain Calculator / Counter\n[Time, days & years] Day Counter / Time Difference / Year Converter\n[Budget & LINE] Budget Calculator / Bill Splitter / LINE External Browser URL\n[Cards] NamaStopwatch / Reverse-countdown ToDo / Yaraseru ToDo\nThe list can be reordered. Each tool is described below.\n\n■ Plain Calculator\nA simple calculator for the four basic operations, with parentheses and percent. It has big keys, shows the expression and its result, and has three memo fields at the bottom.\n\n■ Counter\nA counter modeled on the tally counters used in traffic surveys. It has ten slots (1-10) that you can switch between and count separately. Tap the large TAP area to count; the count is shown big in a seven-segment-style display. Sound effects can be toggled on or off, and the current slot can be reset.\n\n■ Day Counter\nCalculates the date a given number of days before or after a base date, and shows it on a calendar.\n\n■ Time Difference\nSet a start time and an end time, and the elapsed time between them is calculated. The result is shown as hours and minutes, with the total number of minutes as well.\n\n■ Year Converter\nConverts between Western years and Japanese eras - all eras (Reiwa, Heisei, Showa, Taisho, Meiji) in both directions. It also converts between birthdays and ages: from a birthday to the current age, and from a current age to the possible range of birthdays.\n\n■ Budget Calculator\nSet a budget first, then add expenses one by one and the balance is calculated automatically. Shows the expense total and can clear all expenses.\n\n■ Bill Splitter\nEnter the total amount and the number of people to split a bill (a tax rate can also be set). Rounding can be adjusted (to the yen, round up so there is change left over, or round down so it comes up short; units of 10, 100, 500 or 1000 yen), and different groups can be charged different amounts.\n\n■ LINE External Browser URL\nURLs pasted into LINE chats open in LINE's in-app browser, but adding ?openExternalBrowser=1 to the end of a URL sends it to an external browser instead. This tool appends that parameter to a URL from your clipboard or one you type in, and copies the result.\n\n■ NamaStopwatch\nA stopwatch that lets you prepare multiple named stopwatches in advance, organized in song lists. Each song can hold multiple timings (each stored with its date and time), songs can be reordered, and the results can be totaled up. While timing, the song name and time are shown big - tap anywhere on the screen to stop - and there is an option to keep the screen awake. Handy for timing each piece during a performance and for concert scheduling.\n\n■ Reverse-countdown ToDo\nA ToDo that works backwards from when you need to leave, laying out getting-ready and travel steps in order. Enter each task and how long it takes, and it shows when everything will be done, and keeps the schedule visible in the notification area. Action sets and full sets let you recall your usual getting-ready flow in one go. It was built as a practical way to cut down on being late.\nNote: the alerts by notification and vibration at the planned time are a feature of the APK version (the Android app). The PWA is vulnerable to the device going to sleep, so it is not suited to alerts that must not be missed (on a PC that never sleeps, the PWA works fine).\n\n■ Yaraseru ToDo\nA ToDo combined with a camera-based presence check. Between \"start\" and \"done\", it checks in every few minutes: you cover the camera with your hand to report \"I'm up\". The check interval can be fixed or random (with shortest and longest bounds), and if you do not respond within the response time, it alerts you with a loud alarm and a full-screen display. The camera is only used from a few seconds before each check until it ends, and no video is saved or sent. If the camera does not work, a troubleshooting screen in the settings shows information such as the running URL and permission states.\nNote: forceful wake-up features such as the loud alarm and full-screen display are features of the APK version (the Android app), because the PWA is vulnerable to the device going to sleep (on a PC that never sleeps, the PWA works fine).\n\n■ Shared features\nNotification sound settings (choose alarm sound or notification sound, and pick the chime), backup and restore (export all data to a single .nmk file for backups or moving to another device; on import you can pick which items to overwrite), resetting the menu order to the default layout, checking for updates, and installing as an app. Dates and times can be entered by tapping to type directly or by dragging up and down like a dial.\n\n■ Screen Guide\n1) Tool list: tap a tool; drag the handle to reorder.\n2) Plain Calculator: big keys and three memo fields.\n3) Day Counter: base date + days, shown on a calendar with the Japanese era.\n4) Budget Calculator: add expenses and the balance updates automatically.\n5) Year Converter: era conversion and age-related calculations.\n6) Counter: switch between slots 1-10 and tap the large TAP area to count.\n7) Time Difference: elapsed time from a start and end time, with the total in minutes.\n8) Bill Splitter: total and headcount, with rounding and per-group price differences.\n9) LINE External Browser URL: appends the parameter to a clipboard or typed URL and copies it.\n10) NamaStopwatch (song list): add timings per song, reorder songs, and total up the results.\n11) NamaStopwatch (timing): song name and time shown big; tap anywhere to stop.\n12) Reverse-countdown ToDo: enter tasks and durations to see the schedule for each target finish time.\n13) Yaraseru ToDo (settings, presence check): cover the camera by hand to report you are up; set the check interval and response time.", "moreAppsTitle": "More apps by Nama", "moreAppNames": {"namacollage": "なまこ", "namatunepdf": "NamaTunePDF", "namapo": "NamaPo"}, "apkButtonText": "🤖 Download the Android APK"}, "apkUrl": "https://raw.githubusercontent.com/nama1223/NamaKe/main/NamaKe.apk"};
let currentLang = 'ja';
</script>

<script>
const getBlankImgSvg = (num) => `data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='400' height='600'%3E%3Crect width='100%25' height='100%25' fill='%23e8eaed'/%3E%3Ctext x='50%25' y='50%25' font-family='sans-serif' font-size='24' fill='%239aa0a6' text-anchor='middle' dominant-baseline='middle'%3ENo Image ${num}%3C/text%3E%3C/svg%3E`;
const BLANK_ICON_SVG = "data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='200' height='200'%3E%3Crect width='100%25' height='100%25' fill='%23e8eaed'/%3E%3Ctext x='50%25' y='50%25' font-family='sans-serif' font-size='24' fill='%239aa0a6' text-anchor='middle' dominant-baseline='middle'%3EIcon%3C/text%3E%3C/svg%3E";

function renderUI() {
    const textData = APP_CONFIG[currentLang];
    document.getElementById('ui-title').innerText = textData.title || "";
    document.getElementById('ui-developer').innerText = textData.developer || "";
    const mainIcon = document.getElementById('ui-app-icon');
    mainIcon.src = APP_CONFIG.appIcon;
    mainIcon.onerror = () => { mainIcon.onerror = null; mainIcon.src = BLANK_ICON_SVG; };
    
    const actionBtn = document.getElementById('ui-action-btn');
    actionBtn.innerText = textData.buttonText || "";
    actionBtn.href = APP_CONFIG.appUrl || "#";
    const apkBtn = document.getElementById('ui-apk-btn');
    if (APP_CONFIG.apkUrl) { apkBtn.style.display = ""; apkBtn.innerText = textData.apkButtonText || ""; apkBtn.href = APP_CONFIG.apkUrl; }
    else { apkBtn.style.display = "none"; }
    
    document.getElementById('ui-screenshots-title').innerText = textData.screenshotsTitle || "";
    document.getElementById('ui-description').innerHTML = textData.description || "";
    document.getElementById('ui-more-apps-title').innerText = textData.moreAppsTitle || "";
    
    const gallery = document.getElementById('ui-gallery');
    if (gallery.innerHTML.trim() === "") {
        APP_CONFIG.media.forEach((item, index) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'gallery-item-wrapper';
            wrapper.onclick = () => openLightbox(index);
            
            if (item.type === 'youtube') {
                const img = document.createElement('img');
                img.className = 'gallery-item img-landscape';
                img.src = `https://img.youtube.com/vi/${item.id}/hqdefault.jpg`;
                wrapper.appendChild(img);
                const playIcon = document.createElement('div');
                playIcon.className = 'play-icon'; playIcon.innerHTML = '▶';
                wrapper.appendChild(playIcon);
            } else if (item.type === 'video') {
                const video = document.createElement('video');
                video.className = 'gallery-item img-portrait';
                video.src = item.src;
                video.preload = 'metadata';
                wrapper.appendChild(video);
                const playIcon = document.createElement('div');
                playIcon.className = 'play-icon'; playIcon.innerHTML = '▶';
                wrapper.appendChild(playIcon);
            } else {
                const img = document.createElement('img');
                img.className = 'gallery-item img-portrait';
                img.src = item.src;
                img.onerror = () => { img.onerror = null; img.src = getBlankImgSvg(index + 1); };
                wrapper.appendChild(img);
            }
            gallery.appendChild(wrapper);
        });
    }

    const moreAppsGrid = document.getElementById('ui-more-apps-grid');
    moreAppsGrid.innerHTML = "";
    if(APP_CONFIG.moreApps) {
        APP_CONFIG.moreApps.forEach(app => {
            const a = document.createElement('a');
            a.className = 'more-app-card';
            a.href = app.url;
            const img = document.createElement('img');
            img.className = 'more-app-icon';
            img.src = app.icon;
            img.onerror = () => { img.onerror = null; img.src = BLANK_ICON_SVG; };
            const span = document.createElement('span');
            span.className = 'more-app-name';
            span.innerText = textData.moreAppNames ? (textData.moreAppNames[app.id] || "") : "";
            a.appendChild(img);
            a.appendChild(span);
            moreAppsGrid.appendChild(a);
        });
    }
}

function toggleLanguage() { currentLang = currentLang === 'ja' ? 'en' : 'ja'; renderUI(); }

let currentMediaIndex = 0;
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');
const lightboxVideo = document.getElementById('lightbox-video');

function openLightbox(index) { currentMediaIndex = index; updateLightboxMedia(); lightbox.classList.add('active'); document.body.style.overflow = 'hidden'; }
function closeLightbox() { lightbox.classList.remove('active'); document.body.style.overflow = ''; lightboxVideo.innerHTML = ''; }
function updateLightboxMedia() {
    const item = APP_CONFIG.media[currentMediaIndex];
    lightboxImg.style.opacity = '0'; lightboxVideo.style.opacity = '0'; lightboxVideo.innerHTML = ''; 
    setTimeout(() => {
        if (item.type === 'youtube') {
            lightboxImg.style.display = 'none'; lightboxVideo.style.display = 'block';
            lightboxVideo.innerHTML = `<iframe src="https://www.youtube.com/embed/${item.id}?autoplay=1&rel=0&modestbranding=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
            lightboxVideo.style.opacity = '1';
        } else if (item.type === 'video') {
            lightboxImg.style.display = 'none'; lightboxVideo.style.display = 'block';
            lightboxVideo.innerHTML = `<video src="${item.src}" controls autoplay style="width:100%; height:100%; max-height:80vh; object-fit:contain; outline:none;"></video>`;
            lightboxVideo.style.opacity = '1';
        } else {
            lightboxVideo.style.display = 'none'; lightboxImg.style.display = 'block';
            const tempImg = new Image();
            tempImg.src = item.src;
            tempImg.onload = () => { lightboxImg.src = tempImg.src; lightboxImg.style.opacity = '1'; };
            tempImg.onerror = () => { lightboxImg.src = getBlankImgSvg(currentMediaIndex + 1); lightboxImg.style.opacity = '1'; };
        }
    }, 150);
}
function prevMedia(e) { if(e) e.stopPropagation(); currentMediaIndex = (currentMediaIndex > 0) ? currentMediaIndex - 1 : APP_CONFIG.media.length - 1; updateLightboxMedia(); }
function nextMedia(e) { if(e) e.stopPropagation(); currentMediaIndex = (currentMediaIndex < APP_CONFIG.media.length - 1) ? currentMediaIndex + 1 : 0; updateLightboxMedia(); }

lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
let touchStartX = 0; let touchEndX = 0;
lightbox.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; });
lightbox.addEventListener('touchend', e => {
    touchEndX = e.changedTouches[0].screenX;
    const swipeThreshold = 50;
    if (touchEndX < touchStartX - swipeThreshold) nextMedia();
    if (touchEndX > touchStartX + swipeThreshold) prevMedia();
});
window.onload = renderUI;
</script>
</body>
