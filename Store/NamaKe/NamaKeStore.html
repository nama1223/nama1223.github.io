<script>
const APP_CONFIG = {"appUrl": "/NamaKe/", "appIcon": "/NamaKe/Namake512.png", "media": [{"type": "image", "src": "screen-top.jpg"}, {"type": "image", "src": "screen-calc.jpg"}, {"type": "image", "src": "screen-days.jpg"}, {"type": "image", "src": "screen-budget.jpg"}, {"type": "image", "src": "screen-year.jpg"}, {"type": "image", "src": "screen-counter.jpg"}, {"type": "image", "src": "screen-timediff.jpg"}, {"type": "image", "src": "screen-warikan.jpg"}, {"type": "image", "src": "screen-line.jpg"}, {"type": "image", "src": "screen-namasu-list.jpg"}, {"type": "image", "src": "screen-namasu-run.jpg"}, {"type": "image", "src": "screen-reverse-todo.jpg"}, {"type": "image", "src": "screen-yaraseru.jpg"}], "moreApps": [{"id": "namacollage", "icon": "/NamaCollage/NamaCollageLogo512.png", "url": "/NamaCollage/"}, {"id": "namatunepdf", "icon": "/NamaTunePDF/NamaTunePDF512.png", "url": "/NamaTunePDF/"}, {"id": "namapo", "icon": "/NamaPo/NamaPo512.png", "url": "/NamaPo/"}], "ja": {"title": "Nama計算機 ─ 計算ツール集「なまけ」─", "developer": "生", "buttonText": "Webアプリを起動", "screenshotsTitle": "スクリーンショット/画面説明", "description": "日々の「ちょっと計算したい」を集めた計算ツール集。\n「プライベート用途」と銘打っているのは、汎用化する気のない自分向け仕様が多めだからで、便利そうなら他の方にもどんどん使って欲しい次第です。\n\n■ ツール全11種\n単なる電卓／数をかぞえるやつ\n日数計算機／時間差計算／「年」計算機\n予算収支計算機／ワリカン／LINE用外部ブラウザURL\nNamaStopwatch（なます）／逆算ToDo／やらせるToDo\n一覧の並べ替えもできます。各ツールの説明は以下の通りです。\n\n<HR>■ 単なる電卓\n四則演算ができる、シンプルな電卓です。大きめのキーで入力し、計算式と結果が表示されます。下部にメモ欄が3つあります。\n計算機と名乗るので付けてみただけで、作者自身もほぼ未使用。\n\n<HR>■ 数をかぞえるやつ\n交通量調査のあれをマネしました。\n保存枠が10枠あり、切り替えて数えられます。\nシンプルゆえにボタンを大きくして操作のストレスを減らしました。\n人数確認とか集計とか、地味に使える場面も多そうな。\n使うことを「思いつく」ハードルの方が高そうですが。\n\n■ 日数計算機\n基準日から見て何日前、または何日後の日付を計算し、カレンダーにも表示します。\n作者の場合、Povoのサブ回線を維持するために作りました。\n\n<HR>■ 時間差計算\n開始時間と終了時間を設定すると、経過時間が計算されます。\n結果は「時：分」の他に分数の合計でも表示されます。\n作者の場合、公共施設で利用開始時間と終了時間を書くことがあり、利用時間も計算して書かないといけないので「こういう時不便なことありそうだな」と作ってみました。\nでも暗算しがちです。\n\n<HR>■ 「年」計算機\n・西暦⇔和暦の変換\n計算の仕方を覚えるのが面倒なので実装しました。\n令和から明治までの相互変換に対応。\n\n・誕生日⇔年齢\n普通に相互変換できる上、ひとひねり加えてあります。\n(1)誕生日を指定した上で、基準日を「今日」以外に指定して計算できる。3ヶ月前現在での年齢を見たい、とか\n(2)年齢→誕生日の場合、「3日前の時点で45歳なら、何年の何月何日～何月何日までに産まれたか」のような計算が可能\n\n<HR>■ 予算収支計算機\n倹約向け。\n予算を先に設定し、出費を一件ずつ追加していくと収支が自動計算されます。\n家計簿より軽い用途向きというか、完全に自分用。\n\n<HR>■ ワリカン\n計算機だからこういうのあってもいいかな、と作ってみたもの。\n調整範囲を広くしてみたら、少し見づらくなってしまいました。\n\n・複数にグループ(班)分けして価格調整できる(男性・女性・飲まない人、みたいな)\n・小銭が出ないようにキリを良くできる\n・端数を余らせるか不足させるか選べ、幹事が一人で負担したりもらっちゃう設定もできる\n\nなお、「班」という単語を選んだのは画面内の字数を減らすためです。\n\n<HR>■ LINE用外部ブラウザURL\nLINEのトークにURLを貼るとLINEの内部ブラウザで開かれてしまいますが、URLの終わりに ?openExternalBrowser=1 をつけると外部ブラウザへ誘導できます。\n長くて暗記も入力も面倒なので、自作アプリに盛り込みました。\nクリップボード内のURLにくっつけたり、手動で入れたURLに付与したりできます。\n\n<HR>■ NamaStopwatch（なます）\n開発用途は「演奏会へ向けた、曲の時間計測」。\n測った後に手書きで曲名やら時間をメモしていると合奏が止まるので、それらを先に設定できるように、そしてまとめて記録できるようにしました。\n\nまず「曲リスト」を最初に作成し、その中に曲のタイトルを追加していくと曲ごとのストップウォッチが作成できます。\n計測開始画面はタップエリアを巨大にしてあります。楽器を構えてても押しやすいように。\nまた、誤タップで計測済みの曲を再開してしまわないように簡易ロックもついています。\n\n集計機能もあり、全曲の時間を合計して表示できたり、本番の休憩想定時間を追加したりできます。\nメンバー配布ようにスクリーンショットを想定した画面構成にしつつ、テキストでコピーするボタンもあります。\n\n──ただし、まだ実際に使ってないので細部が色々と雑\n\n<HR>■ 逆算ToDo\nすごく自分用の機能。APK版が推奨。\n\n出かける時刻から逆算して、支度や移動の段取りを並べるToDoです。\n設定するのは「行動」と「完了予定時刻」。\nたとえば12:00完了予定で、「行動」に食事20分・入浴30分・荷造り10分をセットすると、11:00からそれぞれの開始・終了時間が表示されます。\n\n入力を省略するための機能が豊富。\n・「行動」は組み合わせて「行動セット」を保存できる\n・「完了予定時刻」は名前をつけて保存できる\n(東京駅に何時に着くための電車に乗る時間、のような保存の仕方)\n・上記２つを組み合わせた「フルセット」を保存しておけば一発でセット出来る\n\n目覚ましを複数セットするタイプの人でも使えるように、完了予定時刻は同時に３つまでセットできます。\n\n【APK版（Android用アプリ版）限定】\n行動を開始すべき時刻に音やバイブを鳴らせます。\n完了予定時刻１～３でそれぞれ違う音が鳴ります。\nド↑ド↓ド／ドソー／ド ♭ミ ソー\n\n<HR>■ やらせるToDo\nPC、もしくはAPK版推奨。どちらかといえばPCでの利用を想定。\nうだうだしていて行動を開始できない、という人のためのToDo。\n\n【基本機能】\n・「やること」の名前だけ設定して放置すると定期的に催促する\n・「開始時間」も設定した場合、その時間に開始ボタンを押さないと催促する\n\n【生存確認】機能 (オフも可)\n開始してから定期的に「ほんとにやってる？」と確認して来ます。\nカメラに手をかざすことで生存確認完了します。\n放置するとやかましく鳴ります。\n\n【脱線】機能\nちょっとお手洗い！とか、今だけネットで調べ物したい！とかいう時に押すボタン。\n生存確認が停止し、活動時間からも計算外になります。\n時間切れになる前に戻ると「おかえり！」って演出つきで迎えてくれます。\n時間切れで放置するとやかましく鳴ります。\n\n【褒める】機能\n行動を開始して、終わらせた時に「よくやったね」的な感じで褒めてくれます。\n褒め言葉は固定ではなくＡＩ生成で、キャラクター設定も選べます。（固定６種・カスタム３種まで）\n\n<HR>■ 共通機能\n通知音の設定（音の種別はアラーム音／通知音から選択、音色も選べます）、設定の読み込み・出力（データを.nmkファイルに書き出してバックアップや端末の引っ越しができ、読み込み時は項目を選んで上書きできます）、メニューの並び順を初期配置に戻す、更新チェック、アプリとしてインストールなどがあります。日付や時刻の入力は、タップで直接入力と上下ドラッグのダイヤル調整の両方に対応しています。\n", "moreAppsTitle": "生 の他のアプリ", "moreAppNames": {"namacollage": "なまこ", "namatunepdf": "NamaTunePDF", "namapo": "NamaPo"}, "apkButtonText": "🤖 APK版（Android）をダウンロード", "whatsnewTitle": "", "whatsnewDate": "", "whatsnewDesc": ""}, "en": {"title": "NamaKe - A Pocket Calculator Toolkit 'Namake' -", "developer": "Nama", "buttonText": "Launch Web App", "screenshotsTitle": "Screenshots & Guide", "description": "A collection of calculation tools for those everyday \"quick calculations.\"\nThe reason it's labeled \"for private use\" is because many of the tools are designed for personal use and not intended for generalization. However, if you find them useful, please feel free to use them as well.\n\n■ 11 Tools in Total\nSimple Calculator / Number Counter\nDay Calculator / Time Difference Calculator / \"Year\" Calculator\nBudget Calculator / Split Bill / External Browser URL for LINE\nNamaStopwatch (Namasu) / Reverse Calculation To-Do List / Assigning To-Do List\nYou can also sort the list. Descriptions of each tool are as follows:\n\n<HR>■ Simple Calculator\nA simple calculator that can perform basic arithmetic operations. Input is done using large keys, and the calculation formula and result are displayed. There are three memo fields at the bottom.\n\nI added this because it's called a calculator; even the creator hardly uses it.\n\n<HR>■ Number Counter\nI modeled it after the traffic volume survey tool.\n\nThere are 10 save slots, which you can switch between to count.\n\nBecause of its simplicity, the buttons are large to reduce the stress of operation.\n\nIt seems like it could be useful in many situations, such as counting people or tallying numbers.\n\nThe bigger hurdle may be thinking of using it in the first place.\n\n■ Day Calculator\nCalculates how many days before or after a given date and displays it on a calendar.\nThe author created this to maintain a secondary line for Povo.\n\n<HR>■ Time Difference Calculator\nSetting the start and end times calculates the elapsed time.\nThe result is displayed as \"hours:minutes\" as well as the sum of minutes.\nThe author sometimes has to write down the start and end times of use at public facilities, and also needs to calculate and write down the usage time, so created this thinking, \"This seems inconvenient in situations like this.\"\nBut I tend to do the calculations mentally.\n\n<HR>■ \"Year\" Calculator\n・Conversion between Western and Japanese calendars\nImplemented this because remembering how to calculate it is troublesome.\nSupports conversion between all eras from Meiji to Reiwa.\n\n* Birthday ⇔ Age\nIt can easily convert between the two, but with a little twist.\n(1) You can specify a birthday and then specify a reference date other than \"today\" for calculations. For example, you can see your age as of 3 months ago.\n(2) When converting age to birthday, you can calculate things like, \"If you were 45 years old 3 days ago, between what year, month, and day you were born?\"\n\n<HR>■ Budget and Expenditure Calculator\nFor frugality.\nSet your budget first, and then add expenses one by one; the income and expenses will be calculated automatically.\nSuitable for lighter uses than a household ledger, or rather, completely for personal use.\n\n<HR>■ Splitting the Bill\nI made this because I thought it would be nice to have something like this in a calculator.\nI widened the adjustment range, but it became a little difficult to read.\n\n* Allows for price adjustments by dividing participants into multiple groups (e.g., men, women, non-drinkers).\n* Allows for rounding prices to avoid small change.\n* Allows for choosing whether to leave a surplus or deficit, and settings to allow the organizer to cover or receive the difference.\n\nNote: The word \"group\" was chosen to reduce the number of characters displayed on the screen.\n\n\n<HR>■ External Browser URL for LINE\nWhen you paste a URL into a LINE chat, it opens in LINE's internal browser. However, adding `?openExternalBrowser=1` to the end of the URL will redirect to an external browser.\n\nSince it's long and cumbersome to memorize and input, I incorporated it into my custom app.\n\nIt can be attached to URLs in the clipboard or added to manually entered URLs.\n\n\n<HR>■ NamaStopwatch (Namasu)\n\nThe development purpose is \"measuring song durations for concerts.\"\n\nSince manually noting song titles and durations after measuring would stop the ensemble performance, I made it possible to set these beforehand and record them all together.\n\n\nFirst, you create a \"song list,\" and then add song titles to it to create a stopwatch for each song.\n\nThe start screen for timing has a large tap area, making it easy to press even while holding an instrument.\n\nThere's also a simple lock to prevent accidentally resuming a song that's already been timed.\n\nThere's also a tallying function, allowing you to display the total time for all songs and add estimated break times for the actual performance.\n\nThe screen layout is designed for screenshots for distribution to members, and there's also a button to copy the text.\n\n──However, I haven't actually used it yet, so there are many rough details.\n\n<HR>■ Reverse Calculation To-Do\nA very personal feature. APK version recommended.\n\nThis is a To-Do list that works backward from the time you need to leave, outlining preparations and travel arrangements.\n\nYou set the \"Action\" and \"Estimated Completion Time.\"\n\nFor example, if you set an action to be completed by 12:00, and include 20 minutes for eating, 30 minutes for bathing, and 10 minutes for packing, the start and end times for each will be displayed from 11:00.\n\nIt has many features to simplify input.\n\n* Actions can be combined and saved as \"Action Sets.\"\n\n* Completion Times can be saved with a name.\n(For example, saving the time to take the train to arrive at Tokyo Station at a certain time.)\n\n* Saving a \"Full Set\" combining the above two allows for one-touch setup.\n\nTo accommodate people who set multiple alarms, you can set up to three completion times simultaneously.\n\n[APK Version (Android App Version) Only]\nYou can set sounds or vibrations to indicate when an action should start.\n\nDifferent sounds play for completion times 1-3.\n\nDo↑Do↓Do/DoSo/Do♭MiSo\n\n<HR>■ Assigning To-Do\nPC or APK version recommended. It is primarily intended for PC use.\n\nA To-Do list for people who procrastinate and can't get started.\n\n[Basic Functions]\n- If you only set a \"to-do\" name and leave it alone, it will periodically remind you.\n- If you also set a \"start time,\" it will remind you if you don't press the start button at that time.\n\n[Survival Check] Function (Can be turned off)\nAfter starting, it will periodically check \"Are you really doing it?\".\nYou can complete the survival check by holding your hand over the camera.\nIf left unattended, it will make a loud noise.\n\n[Digression] Function\nA button to press when you need to go to the restroom or just want to look something up online.\nSurvival checks will stop, and the time will not be calculated.\nIf you return before the time runs out, it will greet you with a \"Welcome back!\" animation.\nIf left unattended after the time runs out, it will make a loud noise.\n\n[Praise] Function\nWhen you start and finish an action, it will praise you with something like \"Well done.\"\nThe praise is not fixed but AI-generated, and you can also choose the character setting. (Up to 6 fixed types, up to 3 custom types)\n\n<HR>■ Common Functions\nSetting notification sounds (select sound type from alarm sound/notification sound, and also select tone), loading and exporting settings (export data to a .nmk file for backup or device migration; when loading, you can select items and overwrite them), resetting menu order to default, checking for updates, installing as an app, etc. Date and time input supports both direct input by tapping and dial adjustment by dragging up and down.\n\n", "moreAppsTitle": "More apps by Nama", "moreAppNames": {"namacollage": "なまこ", "namatunepdf": "NamaTunePDF", "namapo": "NamaPo"}, "apkButtonText": "🤖 Download the Android APK", "whatsnewTitle": "", "whatsnewDate": "", "whatsnewDesc": ""}, "apkUrl": "https://raw.githubusercontent.com/nama1223/NamaKe/main/NamaKe.apk"};
let currentLang = 'ja';

<script>
const getBlankImgSvg = (num) => `data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='400' height='600'%3E%3Crect width='100%25' height='100%25' fill='%23e8eaed'/%3E%3Ctext x='50%25' y='50%25' font-family='sans-serif' font-size='24' fill='%239aa0a6' text-anchor='middle' dominant-baseline='middle'%3ENo Image ${num}%3C/text%3E%3C/svg%3E`;
const BLANK_ICON_SVG = "data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='200' height='200'%3E%3Crect width='100%25' height='100%25' fill='%23e8eaed'/%3E%3Ctext x='50%25' y='50%25' font-family='sans-serif' font-size='24' fill='%239aa0a6' text-anchor='middle' dominant-baseline='middle'%3EIcon%3C/text%3E%3C/svg%3E";

function renderUI() {
    const textData = APP_CONFIG[currentLang];
    document.getElementById('ui-title').innerText = textData.title || "";
    document.getElementById('ui-developer').innerText = textData.developer || "";
    const mainIcon = document.getElementById('ui-app-icon');
    mainIcon.src = APP_CONFIG.appIcon;
    mainIcon.onerror = () => { mainIcon.onerror = null; mainIcon.src = BLANK_ICON_SVG; };
    
    const actionBtn = document.getElementById('ui-action-btn');
    actionBtn.innerText = textData.buttonText || "";
    actionBtn.href = APP_CONFIG.appUrl || "#";
    const apkBtn = document.getElementById('ui-apk-btn');
    if (APP_CONFIG.apkUrl) { apkBtn.style.display = ""; apkBtn.innerText = textData.apkButtonText || ""; apkBtn.href = APP_CONFIG.apkUrl; }
    else { apkBtn.style.display = "none"; }
    
    document.getElementById('ui-screenshots-title').innerText = textData.screenshotsTitle || "";
    document.getElementById('ui-description').innerHTML = textData.description || "";
    document.getElementById('ui-more-apps-title').innerText = textData.moreAppsTitle || "";
    
    const gallery = document.getElementById('ui-gallery');
    if (gallery.innerHTML.trim() === "") {
        APP_CONFIG.media.forEach((item, index) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'gallery-item-wrapper';
            wrapper.onclick = () => openLightbox(index);
            
            if (item.type === 'youtube') {
                const img = document.createElement('img');
                img.className = 'gallery-item img-landscape';
                img.src = `https://img.youtube.com/vi/${item.id}/hqdefault.jpg`;
                wrapper.appendChild(img);
                const playIcon = document.createElement('div');
                playIcon.className = 'play-icon'; playIcon.innerHTML = '▶';
                wrapper.appendChild(playIcon);
            } else if (item.type === 'video') {
                const video = document.createElement('video');
                video.className = 'gallery-item img-portrait';
                video.src = item.src;
                video.preload = 'metadata';
                wrapper.appendChild(video);
                const playIcon = document.createElement('div');
                playIcon.className = 'play-icon'; playIcon.innerHTML = '▶';
                wrapper.appendChild(playIcon);
            } else {
                const img = document.createElement('img');
                img.className = 'gallery-item img-portrait';
                img.src = item.src;
                img.onerror = () => { img.onerror = null; img.src = getBlankImgSvg(index + 1); };
                wrapper.appendChild(img);
            }
            gallery.appendChild(wrapper);
        });
    }

    const moreAppsGrid = document.getElementById('ui-more-apps-grid');
    moreAppsGrid.innerHTML = "";
    if(APP_CONFIG.moreApps) {
        APP_CONFIG.moreApps.forEach(app => {
            const a = document.createElement('a');
            a.className = 'more-app-card';
            a.href = app.url;
            const img = document.createElement('img');
            img.className = 'more-app-icon';
            img.src = app.icon;
            img.onerror = () => { img.onerror = null; img.src = BLANK_ICON_SVG; };
            const span = document.createElement('span');
            span.className = 'more-app-name';
            span.innerText = textData.moreAppNames ? (textData.moreAppNames[app.id] || "") : "";
            a.appendChild(img);
            a.appendChild(span);
            moreAppsGrid.appendChild(a);
        });
    }
}

function toggleLanguage() { currentLang = currentLang === 'ja' ? 'en' : 'ja'; renderUI(); }

let currentMediaIndex = 0;
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');
const lightboxVideo = document.getElementById('lightbox-video');

function openLightbox(index) { currentMediaIndex = index; updateLightboxMedia(); lightbox.classList.add('active'); document.body.style.overflow = 'hidden'; }
function closeLightbox() { lightbox.classList.remove('active'); document.body.style.overflow = ''; lightboxVideo.innerHTML = ''; }
function updateLightboxMedia() {
    const item = APP_CONFIG.media[currentMediaIndex];
    lightboxImg.style.opacity = '0'; lightboxVideo.style.opacity = '0'; lightboxVideo.innerHTML = ''; 
    setTimeout(() => {
        if (item.type === 'youtube') {
            lightboxImg.style.display = 'none'; lightboxVideo.style.display = 'block';
            lightboxVideo.innerHTML = `<iframe src="https://www.youtube.com/embed/${item.id}?autoplay=1&rel=0&modestbranding=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
            lightboxVideo.style.opacity = '1';
        } else if (item.type === 'video') {
            lightboxImg.style.display = 'none'; lightboxVideo.style.display = 'block';
            lightboxVideo.innerHTML = `<video src="${item.src}" controls autoplay style="width:100%; height:100%; max-height:80vh; object-fit:contain; outline:none;"></video>`;
            lightboxVideo.style.opacity = '1';
        } else {
            lightboxVideo.style.display = 'none'; lightboxImg.style.display = 'block';
            const tempImg = new Image();
            tempImg.src = item.src;
            tempImg.onload = () => { lightboxImg.src = tempImg.src; lightboxImg.style.opacity = '1'; };
            tempImg.onerror = () => { lightboxImg.src = getBlankImgSvg(currentMediaIndex + 1); lightboxImg.style.opacity = '1'; };
        }
    }, 150);
}
function prevMedia(e) { if(e) e.stopPropagation(); currentMediaIndex = (currentMediaIndex > 0) ? currentMediaIndex - 1 : APP_CONFIG.media.length - 1; updateLightboxMedia(); }
function nextMedia(e) { if(e) e.stopPropagation(); currentMediaIndex = (currentMediaIndex < APP_CONFIG.media.length - 1) ? currentMediaIndex + 1 : 0; updateLightboxMedia(); }

lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
let touchStartX = 0; let touchEndX = 0;
lightbox.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; });
lightbox.addEventListener('touchend', e => {
    touchEndX = e.changedTouches[0].screenX;
    const swipeThreshold = 50;
    if (touchEndX < touchStartX - swipeThreshold) nextMedia();
    if (touchEndX > touchStartX + swipeThreshold) prevMedia();
});
window.onload = renderUI;
</script>
</body>
</html>
